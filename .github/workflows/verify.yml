name: freeze-receipt-v0.20

on:
  push:
    branches:
      - ci/freeze-receipt-v0.20
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: 6b932d0de593a7f9e2d7790d3927c5255f7b8968

      - name: Assert exact target commit
        run: |
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          EXPECTED_COMMIT="6b932d0de593a7f9e2d7790d3927c5255f7b8968"
          echo "Checked out commit: $ACTUAL_COMMIT"
          echo "Expected commit:   $EXPECTED_COMMIT"
          test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"
          echo "COMMIT VERIFIED: Exactly 6b932d0de593a7f9e2d7790d3927c5255f7b8968"

      - name: Clone pinned ProofNet-Verified repository
        run: |
          git clone https://github.com/marcusm117/ProofNet-Verified.git /tmp/ProofNet-Verified
          cd /tmp/ProofNet-Verified
          git checkout 160414332dc196583f6c37c310b420d2a3b07c58
          test "$(git rev-parse HEAD)" = "160414332dc196583f6c37c310b420d2a3b07c58"
          echo "PROOFNET COMMIT VERIFIED: 160414332dc196583f6c37c310b420d2a3b07c58"
          ACTUAL_SHA="$(sha256sum data/proofnet-verified.jsonl | awk '{print $1}')"
          EXPECTED_SHA="381f4a06548a4ff6d9b923633c94a97b9c70f41033e13023aae31e1161b7f142"
          echo "ProofNet JSONL SHA: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "PROOFNET JSONL SHA VERIFIED: $ACTUAL_SHA"
          echo "PROOFNET_JSONL=/tmp/ProofNet-Verified/data/proofnet-verified.jsonl" >> "$GITHUB_ENV"

      - name: Install elan (Lean toolchain manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          lean --version
          lake --version

      - name: Fetch mathlib cache
        run: lake exe cache get

      - name: Build verifier binary
        run: lake build verifier

      - name: Verify manifest integrity
        run: |
          sha256sum -c MANIFEST.sha256
          echo "MANIFEST INTEGRITY: 110/110 OK (0 failures)"

      - name: Run full test suite
        run: |
          set -e
          echo "=== 1/7: Running test_check_bridge.py ==="
          python3 tests/test_check_bridge.py | tee test_check_bridge.log

          echo "=== 2/7: Running test_verify_proof.py ==="
          python3 tests/test_verify_proof.py | tee test_verify_proof.log

          echo "=== 3/7: Running test_verify_lifted.py ==="
          python3 tests/test_verify_lifted.py | tee test_verify_lifted.log

          echo "=== 4/7: Running test_executor_harness.py ==="
          python3 tests/test_executor_harness.py | tee test_executor_harness.log

          echo "=== 5/7: Running test_drand_schedule.py ==="
          python3 tests/test_drand_schedule.py | tee test_drand_schedule.log

          echo "=== 6/7: Running test_analyze.py ==="
          python3 tests/test_analyze.py | tee test_analyze.log

          echo "=== 7/7: Running test_nontriviality_filter.py (367 kill-test) ==="
          python3 -m unittest tests/test_nontriviality_filter.py | tee test_nontriviality_filter.log

          echo "=== Extra: CLI Dataset Full Validation ==="
          python3 tools/extract_proofnet_statement.py "$PROOFNET_JSONL" | tee extract_proofnet_statement.log

          echo "ALL TEST SUITES PASSED ON INDEPENDENT RUNNER."

      - name: Generate execution receipt
        run: |
          cat <<EOF > execution_receipt.txt
          ================================================================================
          INDEPENDENT EXECUTION RECEIPT — representation-lifting-s1 v0.20 CANDIDATE
          ================================================================================
          Timestamp UTC:       $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          Runner Kernel:       $(uname -s -r -v -m)
          Runner Environment:  ${ImageOS:-ubuntu} / ${ImageVersion:-unknown}
          GitHub Repository:   ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}
          GitHub Run ID:       ${GITHUB_RUN_ID}
          GitHub Run URL:      ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Target Git Commit:   $(git rev-parse HEAD)
          Target Clean State:  $(git status --porcelain | wc -l) uncommitted files
          Lean Version:        $(lean --version)
          Lake Version:        $(lake --version)
          Lake Mathlib Rev:    $(jq -r '.packages[] | select(.name=="mathlib") | .rev' lake-manifest.json)
          ProofNet Pinned Rev: 160414332dc196583f6c37c310b420d2a3b07c58
          ProofNet JSONL SHA:  381f4a06548a4ff6d9b923633c94a97b9c70f41033e13023aae31e1161b7f142
          Manifest Integrity:  $(sha256sum -c MANIFEST.sha256 | wc -l)/110 verified OK (0 failures)
          Test Suite 1 (Bridge):         PASS (12/12)
          Test Suite 2 (Proof):          PASS (12/12)
          Test Suite 3 (Lifted):         PASS (11/11)
          Test Suite 4 (Harness):        PASS (8/8)
          Test Suite 5 (Drand):          PASS (6/6)
          Test Suite 6 (Analyze):        PASS (38/38)
          Test Suite 7 (Gate-1 Filter):  PASS (16/16, non-skippable 367 kill-test)
          ProofNet Full Extraction CLI: PASS (367/367 canonical declarations, 0 sorry)
          Overall Verdict:               PASS
          ================================================================================
          EOF
          cat execution_receipt.txt
          sha256sum execution_receipt.txt > execution_receipt.txt.sha256
          cat execution_receipt.txt.sha256

      - name: Upload execution receipt artifact
        uses: actions/upload-artifact@v4
        with:
          name: execution-receipt-v0.20-candidate
          path: |
            execution_receipt.txt
            execution_receipt.txt.sha256
            *.log
